name: Fetch sound candidates

# Freesound(CC0) · Wikimedia Commons 에서 자유 라이선스 녹음 후보를 받아
# tools/sound_candidates/ 에 커밋한다 (고르고 다듬기는 tools/build_sounds.py).
on:
  workflow_dispatch:
  push:
    branches: [ "ccr-b01aedf5-h320aa" ]
    paths: [ "tools/fetch_sounds.py" ]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Fetch candidates
        run: python3 tools/fetch_sounds.py

      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sound_candidates
          git commit -m "소리 후보 받기 (Freesound CC0 · Wikimedia Commons)" || echo "nothing new"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
