name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | timeout 180 $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 웹 앱·효과음은 gradle 의 syncWeb / syncRaw 태스크가 APK 에 넣는다
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk banggu-bboong-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: banggu-bboong-debug-apk
          path: banggu-bboong-debug.apk

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.0-apk
          name: 방구뿡 V6 Android APK
          files: banggu-bboong-debug.apk
