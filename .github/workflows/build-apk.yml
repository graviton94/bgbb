name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | timeout 180 $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 웹 앱과 효과음은 gradle 의 syncWebAssets / syncRawSounds 태스크가 APK 에 넣는다.
      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug

      - name: Copy APK to root with clean name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ./banggu-bboong-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: banggu-bboong-debug-apk
          path: ./banggu-bboong-debug.apk

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0-apk
          name: "방구뿡 (Bang-gu Bboong) V5.0.0 Android APK"
          body: |
            ### 🐹 방구뿡 V5.0.0
            - 불시 작전이 진짜로 "하루 N회, 작전 시간대 안에서만" 울림 (AlarmManager)
            - 상주 서비스·WakeLock 제거 → 대기 중 배터리 소모 거의 0
            - 앱이 꺼져 있을 때 울린 기록도 앱을 열면 대담/소심/꾹참으로 집계
          files: ./banggu-bboong-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
