name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare Web Assets and Raw Sounds for Android Package
        run: |
          mkdir -p android/app/src/main/assets/public
          cp index.html index.css app.js android/app/src/main/assets/public/
          cp -r assets android/app/src/main/assets/public/
          mkdir -p android/app/src/main/res/raw
          cp assets/sounds/*.wav android/app/src/main/res/raw/
          mkdir -p android/app/src/main/res/drawable
          cp assets/collectibles/acorn.png android/app/src/main/res/drawable/ic_launcher_hamster.png

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK (with Foreground Service & 9 Real WAV Assets)
        working-directory: ./android
        run: gradle assembleDebug

      - name: Copy APK to root with clean name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ./banggu-bboong-v4-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: banggu-bboong-v4-debug-apk
          path: ./banggu-bboong-v4-debug.apk

      - name: Publish APK to GitHub Release (latest-apk)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.1-apk
          name: "방구뿡 (Bang-gu Bboong) V4.1.1 Android APK"
          body: |
            ### 🐹 방구뿡 V4.1.1 Android APK 빌드 완료
            - **시간대별 배경/소품 색 톤 변화 & 모닥불 야간 3중 불빛 파장 탑재**
            - **리얼 물리 음향 효과음 9종 (`res/raw/*.wav`) 내장**
            - **Android Foreground Service (`PocketSecretService`) + WakeLock 탑재**
          files: ./banggu-bboong-v4-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
