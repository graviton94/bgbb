name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Web tests (schedule rules)
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | timeout 180 $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      # 서명 키가 등록돼 있으면 서명된 AAB, 없으면 서명 안 된 AAB (빌드 확인용)
      - name: Release bundle
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.BGBB_KEYSTORE_BASE64 }}
          BGBB_KEYSTORE_PASSWORD: ${{ secrets.BGBB_KEYSTORE_PASSWORD }}
          BGBB_KEY_ALIAS: ${{ secrets.BGBB_KEY_ALIAS }}
          BGBB_KEY_PASSWORD: ${{ secrets.BGBB_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export BGBB_KEYSTORE="$RUNNER_TEMP/upload.jks"
          fi
          ./gradlew --no-daemon bundleRelease

      - name: Collect outputs
        run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/bgbb-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/bgbb-release.aab
          cp android/app/build/outputs/mapping/release/mapping.txt out/mapping.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: bgbb-build
          path: out/
