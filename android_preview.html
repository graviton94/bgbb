<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>방구뿡 Android 14 실기기 테스트 에뮬레이터</title>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #181920;
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      gap: 26px;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #fff;
    }
    .phone-frame {
      width: 412px;
      height: 892px;
      background: #0d0e12;
      border-radius: 52px;
      padding: 12px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.65), inset 0 0 0 2px #343846;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .phone-screen {
      flex: 1;
      background: #FFFDF8;
      border-radius: 40px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .android-status-bar {
      height: 34px;
      background: #282523;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 22px;
      font-size: 12px;
      font-weight: 600;
      position: relative;
      z-index: 100;
    }
    .punch-hole {
      width: 14px;
      height: 14px;
      background: #000;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 10px;
    }
    .android-fg-notif {
      margin: 6px 10px 2px;
      background: rgba(32, 34, 42, 0.96);
      color: #fff;
      border-radius: 18px;
      padding: 10px 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.28);
      border: 1px solid rgba(254, 211, 106, 0.45);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 90;
    }
    .fg-top {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #FED36A;
    }
    .fg-top img {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
    }
    .fg-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .fg-text {
      font-size: 12px;
      color: #EAECEF;
      line-height: 1.3;
    }
    .fg-action-btn {
      background: #FF5A5F;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .webview-container {
      flex: 1;
      border: none;
      width: 100%;
    }
    .android-nav-bar {
      height: 22px;
      background: #FFFDF8;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .gesture-pill {
      width: 128px;
      height: 4.5px;
      background: #282523;
      border-radius: 4px;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <!-- Phone 1: 낮 시간대 자동 배경 + 중앙 점선 제거된 메인 아지트 -->
  <div class="phone-frame">
    <div class="phone-screen">
      <div class="android-status-bar">
        <span>12:30 · SKT 5G</span>
        <div class="punch-hole"></div>
        <span>📳 🛜 🔋 98%</span>
      </div>
      <div class="android-fg-notif">
        <div class="fg-top">
          <img src="assets/hamster.png" alt="icon">
          <strong>방구뿡 · Foreground Service (WakeLock ON)</strong>
          <span style="margin-left:auto;color:#95D5B2;">● 실행중</span>
        </div>
        <div class="fg-body">
          <div class="fg-text">햄찌와 친구들이 주머니 속 낮잠 중 💤 (09:00 ~ 18:00)</div>
          <button class="fg-action-btn">🚨 긴급탈출(즉시동결)</button>
        </div>
      </div>
      <iframe class="webview-container" src="index.html" id="frame1"></iframe>
      <div class="android-nav-bar"><div class="gesture-pill"></div></div>
    </div>
  </div>

  <!-- Phone 2: 밤/노을 시간대 배경 전환 모습 (별빛 밤하늘) -->
  <div class="phone-frame">
    <div class="phone-screen">
      <div class="android-status-bar">
        <span>21:15 · SKT 5G</span>
        <div class="punch-hole"></div>
        <span>🔊 🛜 🔋 94%</span>
      </div>
      <iframe class="webview-container" src="index.html#night" id="frame2"></iframe>
      <div class="android-nav-bar"><div class="gesture-pill"></div></div>
    </div>
  </div>

  <!-- Phone 3: 원본 비율 100% 보존 + 자동 줄바꿈 적용된 그림일기장 -->
  <div class="phone-frame">
    <div class="phone-screen">
      <div class="android-status-bar">
        <span>21:15 · SKT 5G</span>
        <div class="punch-hole"></div>
        <span>🔊 🛜 🔋 94%</span>
      </div>
      <iframe class="webview-container" src="index.html#diary" id="frame3"></iframe>
      <div class="android-nav-bar"><div class="gesture-pill"></div></div>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        try {
          const f1 = document.getElementById('frame1').contentDocument;
          f1.querySelector('.app-shell').style.border = 'none';
          f1.querySelector('.app-shell').style.height = '100vh';
          f1.querySelector('.app-shell').style.maxHeight = 'none';
          f1.querySelector('.app-shell').style.borderRadius = '0';
          f1.body.style.padding = '0';

          const f2 = document.getElementById('frame2').contentDocument;
          f2.querySelector('.app-shell').style.border = 'none';
          f2.querySelector('.app-shell').style.height = '100vh';
          f2.querySelector('.app-shell').style.maxHeight = 'none';
          f2.querySelector('.app-shell').style.borderRadius = '0';
          f2.body.style.padding = '0';
          // 밤 시간대 테마 적용 시연
          const nightChip = f2.querySelector('.theme-chip[data-theme="night"]');
          if (nightChip) nightChip.click();

          const f3 = document.getElementById('frame3').contentDocument;
          f3.querySelector('.app-shell').style.border = 'none';
          f3.querySelector('.app-shell').style.height = '100vh';
          f3.querySelector('.app-shell').style.maxHeight = 'none';
          f3.querySelector('.app-shell').style.borderRadius = '0';
          f3.body.style.padding = '0';
          f3.getElementById('tabDiaryBtn').click();
        } catch (e) {}
      }, 650);
    });
  </script>
</body>
</html>
