plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bgbb.tamagotchi'
    compileSdk 34

    defaultConfig {
        applicationId "com.bgbb.tamagotchi"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "4.1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 100% Pure Android SDK (API 26+) - 외부 의존성 충돌 제로
}
