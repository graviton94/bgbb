plugins {
    id 'com.android.application'
}

// 웹 앱(저장소 루트)과 효과음을 빌드할 때마다 APK 안으로 복사한다.
def webRoot = rootProject.file('..')
def generated = layout.buildDirectory.dir('generated/bgbb')

def syncWeb = tasks.register('syncWeb', Sync) {
    from(webRoot) {
        include 'index.html', 'styles.css', 'src/**', 'assets/**'
        exclude 'assets/fonts/*.txt'
    }
    into generated.map { it.dir('assets/public') }
}

// 앱이 꺼져 있을 때 알람이 재생할 캐릭터 효과음 → res/raw
def syncRaw = tasks.register('syncRaw', Sync) {
    from(new File(webRoot, 'assets/sounds')) {
        include 'hamster_*.wav', 'tit_*.wav', 'cat_*.wav'
    }
    into generated.map { it.dir('res/raw') }
}

// 출시 서명: 환경변수(CI) 또는 android/keystore.properties (저장소에 올리지 않음)
def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
def sign = { String key, String env -> System.getenv(env) ?: signing.getProperty(key) }

android {
    namespace 'io.github.graviton94.bgbb'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.graviton94.bgbb'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '2.1.0'
    }

    sourceSets {
        main {
            assets.srcDirs += generated.get().dir('assets').asFile
            res.srcDirs += generated.get().dir('res').asFile
        }
    }

    signingConfigs {
        // 테스트 APK 는 저장소에 넣어 둔 고정 키로 서명: CI 빌드마다 키가 바뀌면 폰에 덮어 설치가 안 됨
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def store = sign('storeFile', 'BGBB_KEYSTORE')
            if (store) {
                storeFile file(store)
                storePassword sign('storePassword', 'BGBB_KEYSTORE_PASSWORD')
                keyAlias sign('keyAlias', 'BGBB_KEY_ALIAS')
                keyPassword sign('keyPassword', 'BGBB_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            // 효과음은 이름으로 찾으므로(getIdentifier) 리소스 줄이기는 끈다
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile) signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.named('preBuild') {
    dependsOn syncWeb, syncRaw
}

dependencies {
    implementation 'com.android.billingclient:billing:8.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
