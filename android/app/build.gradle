plugins {
    id 'com.android.application'
}

// 웹 앱(저장소 루트)과 효과음을 빌드할 때마다 APK 안으로 복사한다.
def webRoot = rootProject.file('..')
def generated = layout.buildDirectory.dir('generated/bgbb')

def syncWeb = tasks.register('syncWeb', Sync) {
    from(webRoot) {
        include 'index.html', 'styles.css', 'src/**', 'assets/**'
    }
    into generated.map { it.dir('assets/public') }
}

// 앱이 꺼져 있을 때 알람이 재생할 캐릭터 효과음 → res/raw
def syncRaw = tasks.register('syncRaw', Sync) {
    from(new File(webRoot, 'assets/sounds')) {
        include 'hamster_*.wav', 'tit_*.wav', 'cat_*.wav'
    }
    into generated.map { it.dir('res/raw') }
}

android {
    namespace 'com.bgbb.tamagotchi'
    compileSdk 34

    defaultConfig {
        applicationId "com.bgbb.tamagotchi"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "6.0.0"
    }

    sourceSets {
        main {
            assets.srcDirs += generated.get().dir('assets').asFile
            res.srcDirs += generated.get().dir('res').asFile
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') {
    dependsOn syncWeb, syncRaw
}
