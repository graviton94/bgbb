<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF6E5">
  <title>방구뿡</title>
  <meta name="description" content="주머니 속 다마고치 - 하루 몇 번, 친구들이 불시에 소리를 낸다. 소리면 대담, 진동이면 소심, 무음이면 꾹참!">
  <link rel="preload" href="assets/fonts/jua.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="status" id="status" type="button">
        <span class="dot" id="statusDot"></span>
        <span id="statusText" data-i18n="status.preparing"></span>
      </button>
      <span class="acorns" id="acorns">🌰 0</span>
      <button class="icon-btn" id="openSettings" type="button" data-i18n-attr="aria-label:settings.title">⚙️</button>
    </header>

    <main>
      <!-- 아지트 -->
      <section class="screen active" id="screen-home">
        <div class="world">
          <canvas id="world" role="img" data-i18n-attr="aria-label:home.worldLabel"></canvas>
          <button class="world-chip" id="themeChip" type="button"></button>
        </div>
        <div class="today" id="today"></div>
        <div class="home-actions">
          <button class="btn" id="openDecor" type="button" data-i18n="home.decor"></button>
          <button class="btn freeze" id="freeze" type="button"></button>
        </div>
        <p class="hint" id="homeHint"></p>
      </section>

      <!-- 기록 -->
      <section class="screen" id="screen-records">
        <h2 data-i18n="records.title"></h2>
        <div class="card summary" id="summary"></div>
        <div class="card">
          <h3 data-i18n="records.week"></h3>
          <div class="legend" id="legend"></div>
          <div class="week" id="week" role="img"></div>
        </div>
        <div class="card">
          <h3><span data-i18n="records.treasures"></span> <span class="muted" id="treasureCount"></span></h3>
          <div class="shelf" id="shelf"></div>
        </div>
        <div class="card">
          <h3 data-i18n="records.best"></h3>
          <ol class="best" id="best"></ol>
        </div>
      </section>

      <!-- 일기 -->
      <section class="screen" id="screen-diary">
        <h2 data-i18n="diary.title"></h2>
        <div class="chips" id="weather"></div>
        <input class="note" id="note" maxlength="28" autocomplete="off" data-i18n-attr="placeholder:diary.placeholder">
        <div class="paper"><canvas id="diary" width="1080" height="1920"></canvas></div>
        <button class="btn primary wide" id="shareDiary" type="button" data-i18n="diary.share"></button>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-screen="home" type="button">🏡<span data-i18n="tab.home"></span></button>
      <button class="tab" data-screen="records" type="button">🏆<span data-i18n="tab.records"></span></button>
      <button class="tab" data-screen="diary" type="button">📖<span data-i18n="tab.diary"></span></button>
    </nav>
  </div>

  <!-- 친구 시트 -->
  <dialog class="sheet" id="friendSheet">
    <div class="sheet-body">
      <div class="friend-head">
        <img id="friendImg" alt="">
        <div>
          <h3 id="friendName"></h3>
          <p class="muted" id="friendIntro"></p>
          <div class="level"><span id="friendLevel"></span><div class="bar"><i id="friendBar"></i></div></div>
        </div>
      </div>
      <div class="actions3">
        <button class="btn" id="feed" type="button"></button>
        <button class="btn" id="pat" type="button" data-i18n="friend.pat"></button>
        <button class="btn" id="listen" type="button" data-i18n="friend.listen"></button>
      </div>
      <label class="row">
        <span data-i18n="friend.on"></span>
        <input type="checkbox" class="switch" id="friendOn">
      </label>
      <div class="row-label" data-i18n="friend.sound"></div>
      <div class="chips" id="styles"></div>
      <div class="diy">
        <button class="btn" id="record" type="button" data-i18n="friend.record"></button>
        <span class="muted" id="recordState"></span>
      </div>
      <button class="btn ghost wide" data-close type="button" data-i18n="common.close"></button>
    </div>
  </dialog>

  <!-- 꾸미기 시트 -->
  <dialog class="sheet" id="decorSheet">
    <div class="sheet-body">
      <h3 data-i18n="decor.title"></h3>
      <div class="row-label" data-i18n="decor.bg"></div>
      <div class="chips" id="themes"></div>
      <div class="row-label"><span data-i18n="decor.props"></span> <span class="muted" data-i18n="decor.propsHint"></span></div>
      <div class="props" id="props"></div>
      <button class="btn ghost wide" data-close type="button" data-i18n="common.close"></button>
    </div>
  </dialog>

  <!-- 설정 시트 -->
  <dialog class="sheet" id="settingsSheet">
    <div class="sheet-body">
      <h3 data-i18n="settings.title"></h3>
      <p class="rules" data-i18n-html="settings.rules"></p>
      <label class="row">
        <span data-i18n="settings.op"></span>
        <input type="checkbox" class="switch" id="opOn">
      </label>
      <label class="row">
        <span data-i18n="settings.ambient"></span>
        <input type="checkbox" class="switch" id="ambientOn">
      </label>
      <div class="row">
        <span data-i18n="settings.window"></span>
        <span class="time"><select id="winStart" aria-label="start"></select> ~ <select id="winEnd" aria-label="end"></select></span>
      </div>
      <div class="row-label" data-i18n="settings.freq"></div>
      <div class="chips" id="freqs"></div>
      <div id="previewBox">
        <div class="row-label"><span data-i18n="settings.preview"></span> <span class="muted" data-i18n="settings.previewHint"></span></div>
        <div class="chips" id="previewModes"></div>
      </div>
      <p class="muted" id="scheduleInfo"></p>
      <button class="btn wide" id="fireNow" type="button" data-i18n="settings.fireNow"></button>
      <button class="btn primary wide" id="openSupport" type="button" data-i18n="settings.support"></button>
      <button class="btn wide" id="feedback" type="button" data-i18n="settings.feedback"></button>
      <button class="btn ghost wide danger" id="reset" type="button" data-i18n="settings.reset"></button>
      <p class="links">
        <a href="https://graviton94.github.io/bgbb/privacy/" id="privacyLink" target="_blank" rel="noopener" data-i18n="settings.privacy"></a> ·
        <a href="https://graviton94.github.io/bgbb/#credits" id="creditsLink" target="_blank" rel="noopener" data-i18n="settings.licenses"></a> ·
        <span id="version"></span>
      </p>
      <button class="btn ghost wide" data-close type="button" data-i18n="common.close"></button>
    </div>
  </dialog>

  <!-- 응원하기 -->
  <dialog class="sheet small" id="supportSheet">
    <div class="sheet-body center">
      <h3 data-i18n="support.title"></h3>
      <p data-i18n="support.body"></p>
      <div class="tips" id="tips"></div>
      <p class="muted" data-i18n="support.note"></p>
      <button class="btn ghost wide" data-close type="button" data-i18n="common.close"></button>
    </div>
  </dialog>

  <!-- 보물 상세 -->
  <dialog class="sheet small" id="treasureSheet">
    <div class="sheet-body center">
      <img id="treasureImg" class="treasure-img" alt="">
      <h3 id="treasureName"></h3>
      <p id="treasureLore"></p>
      <p class="cond" id="treasureCond"></p>
      <button class="btn wide" data-close type="button" data-i18n="common.ok"></button>
    </div>
  </dialog>

  <!-- 첫 실행 안내 -->
  <dialog class="sheet small" id="welcome">
    <div class="sheet-body center">
      <h3 data-i18n="welcome.title"></h3>
      <p data-i18n-html="welcome.body"></p>
      <ul class="welcome-modes">
        <li data-i18n-html="welcome.loud"></li>
        <li data-i18n-html="welcome.soft"></li>
        <li data-i18n-html="welcome.hold"></li>
      </ul>
      <p class="muted" data-i18n="welcome.freeze"></p>
      <button class="btn primary wide" data-close type="button" data-i18n="welcome.start"></button>
    </div>
  </dialog>

  <div class="toast" id="toast" popover="manual" role="status" aria-live="polite"></div>
</body>
</html>
