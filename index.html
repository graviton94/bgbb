<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F0">
  <title>방구뿡</title>
  <meta name="description" content="주머니에 셋이 숨어 있음. 하루 몇 번, 아무 때나 뿡. 터질 때마다 칭호 하나.">
  <link rel="preload" href="assets/fonts/blackhansans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-row">
      <span class="logo" data-i18n="appName"></span>
      <span class="top-right">
        <span class="muted" id="streak"></span>
        <button class="top-coins" id="topCoins" type="button"></button>
        <button class="icon-btn" id="openSettings" type="button" data-i18n-attr="aria-label:settings.title">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
        </button>
      </span>
      </div>
      <button class="status" id="status" type="button"><span class="dot" id="statusDot"></span><span id="statusText"></span></button>
      <div class="subhead">
        <button class="sub-latest" id="latest" type="button"><small data-i18n="home.latest"></small><b id="latestName"></b><span id="dexCount"></span></button>
        <span class="mute-wrap"><button class="mute" id="mute" type="button" hidden></button><button class="rules-i" id="rulesInfo" type="button" aria-label="?">i</button></span>
      </div>
    </header>

    <main>
      <!-- 홈: 무표정 -->
      <section class="screen active" id="screen-home">
        <div class="label-row"><div class="label" id="bigLabel"></div></div>
        <h1 class="big" id="big"></h1>
        <p class="line" id="homeLine"></p>
        <p class="today-stats" id="todayStats"></p>
        <div class="stage">
          <div class="home-props" id="homeProps" aria-hidden="true"></div>
          <button class="hero" id="hero" type="button"><img id="heroImg" alt=""><img class="hero-wear" id="heroWear" alt="" hidden></button>
          <div class="bubbles" id="bubbles"></div>
        </div>
        <div class="home-bottom">
          <button class="exact-warn" id="exactWarn" type="button" hidden><span data-i18n-html="exact.warn"></span><b data-i18n="exact.btn"></b></button>
          <div class="tiles">
            <div class="tile"><button class="tile-open" id="wakeOpen" type="button"><small data-i18n="home.wake"></small><b id="wakeInfo"></b></button><input type="checkbox" class="switch" id="wakeOn" aria-labelledby="wakeOpen"></div>
            <div class="tile"><button class="tile-open" id="restOpen" type="button"><small data-i18n="home.rest"></small><b id="restInfo"></b></button><input type="checkbox" class="switch" id="restOn" aria-labelledby="restOpen"></div>
          </div>
          <div class="row3">
            <button class="btn primary" id="cushionBtn" type="button" data-i18n="home.cushion"></button>
            <button class="btn" id="practice" type="button" data-i18n="home.practice"></button>
            <button class="btn" id="freeze" type="button"></button>
          </div>
        </div>
      </section>

      <!-- 꾸미기: 배경 · 소품 · 말풍선 · 모습 (칭호로 해금하거나 뿡코인으로 사기) -->
      <section class="screen" id="screen-shop">
        <div class="dex-head">
          <h2 data-i18n="shop.title"></h2>
          <span class="coins" id="coins"></span>
        </div>
        <p class="muted small shop-how" data-i18n="shop.how"></p>
        <div class="packs" id="coinPacks" hidden></div>
        <div class="filters" id="slots"></div>
        <ul class="shop" id="shopList"></ul>
      </section>

      <!-- 칭호 도감 -->
      <section class="screen" id="screen-dex">
        <div class="dex-head">
          <h2 data-i18n="dex.title"></h2>
          <span class="dex-count" id="dexBig"></span>
        </div>
        <p class="muted small" id="dexStats"></p>
        <div class="filters" id="filters"></div>
        <ul class="dex" id="dexList"></ul>
      </section>
    </main>

    <nav class="nav">
      <button class="tab active" data-screen="home" type="button" data-i18n="tab.home"></button>
      <button class="tab" data-screen="dex" type="button" data-i18n="tab.dex"></button>
      <button class="tab" data-screen="shop" type="button" data-i18n="tab.shop"></button>
      <button class="tab" id="tabSettings" type="button" data-i18n="tab.settings"></button>
    </nav>
  </div>

  <!-- 터지는 순간 · 짤 뽑기: 정사각형 짤 한 칸 (칭호 짤 · 속보 짤 · 랜덤 짤, src/memes.js) -->
  <dialog class="burst" id="burst" tabindex="-1" aria-labelledby="burstTitle">
    <div class="meme" id="meme" role="img"></div>
    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <div class="unlock">
      <div class="u-row"><span class="r-chip" id="burstChip"></span><span class="meta" id="burstWhen"></span></div>
      <strong id="burstTitle"></strong>
      <div class="u-bar" aria-hidden="true"><i id="burstBar"></i></div>
      <span class="meta" id="burstMeta"></span>
    </div>
    <div class="burst-actions">
      <button class="btn dark" id="shareCard" type="button" data-i18n="burst.share"></button>
      <button class="btn" data-close type="button" data-i18n="burst.ok"></button>
    </div>
  </dialog>

  <!-- 획득 팝업 (src/cele.js): 칭호 · 잭팟 · 아이템 -->
  <dialog class="cele" id="cele" tabindex="-1" aria-label="획득">
    <div class="cele-stage"></div>
    <div class="cele-actions"><button type="button"></button><button type="button"></button></div>
  </dialog>

  <!-- 함정설치: 내려놓고 설치 → 누가 들거나 만지면 뿡 -->
  <dialog class="cushion" id="cushion" tabindex="-1" aria-labelledby="cushionTitle">
    <section class="c-setup" id="cSetup">
      <div class="c-face-wrap"><img class="c-face" id="cFace" alt=""><img class="c-shades" src="assets/faces/sunglasses.png" alt=""></div>
      <h2 id="cushionTitle" data-i18n="cushion.title"></h2>
      <p class="c-count" id="cCount"></p>
      <button class="btn primary wide c-arm" id="cArm" type="button" data-i18n="cushion.arm"></button>
      <button class="btn ghost wide" data-close type="button" data-i18n="common.close"></button>
    </section>
    <section class="c-countdown" id="cCountdown" hidden>
      <p data-i18n="cushion.putDown"></p>
      <strong id="cSec">5</strong>
    </section>
    <section class="c-armed" id="cArmed" hidden aria-label="armed"><span data-i18n="cushion.armed"></span></section>
    <section class="c-caught" id="cCaught" hidden>
      <img class="c-face big" id="cCaughtFace" alt="">
      <h2 data-i18n="cushion.caught"></h2>
      <p class="muted" id="cCaughtCount"></p>
      <div class="row2">
        <button class="btn primary" id="cAgain" type="button" data-i18n="cushion.again"></button>
        <button class="btn" data-close type="button" data-i18n="cushion.done"></button>
      </div>
    </section>
  </dialog>

  <!-- 칭호 상세 -->
  <dialog class="sheet small" id="titleSheet">
    <div class="sheet-body">
      <div class="meme ts-meme" id="tsMeme" role="img"></div>
      <span class="rarity" id="tsRarity"></span>
      <h3 class="ts-name" id="tsName"></h3>
      <p id="tsHow"></p>
      <p class="muted small" id="tsMeta"></p>
      <button class="btn dark wide" id="tsShare" type="button" data-i18n="burst.share"></button>
      <button class="btn ghost wide" data-close type="button" data-i18n="common.close"></button>
    </div>
  </dialog>

  <!-- 설정 -->
  <dialog class="sheet" id="settingsSheet">
    <div class="sheet-body">
      <h3 data-i18n="settings.title"></h3>
      <div class="row-label" data-i18n="settings.freq"></div>
      <div class="chips" id="freqs"></div>
      <label class="row" id="notifyRow">
        <span><span data-i18n="settings.notify"></span><small class="muted block" data-i18n="settings.notifyHint"></small></span>
        <input type="checkbox" class="switch" id="notifyOn">
      </label>
      <div id="previewBox">
        <div class="row-label"><span data-i18n="settings.preview"></span> <span class="muted" data-i18n="settings.previewHint"></span></div>
        <div class="chips" id="previewModes"></div>
      </div>
      <p class="muted small" id="scheduleInfo"></p>

      <div class="row-label" data-i18n="settings.friends"></div>
      <div class="friends" id="friends"></div>
      <div class="diy">
        <button class="btn" id="record" type="button" data-i18n="friend.record"></button>
        <span class="muted small" id="recordState"></span>
      </div>

      <button class="btn primary wide" id="openSupport" type="button" data-i18n="settings.support"></button>
      <button class="btn wide" id="openGuide" type="button" data-i18n="settings.guide"></button>
      <button class="btn wide" id="openNotes" type="button" data-i18n="settings.notes"></button>
      <button class="btn wide" id="feedback" type="button" data-i18n="settings.feedback"></button>
      <button class="btn ghost wide danger" id="reset" type="button" data-i18n="settings.reset"></button>
      <p class="links">
        <button class="linkish" id="openPrivacy" type="button" data-i18n="settings.privacy"></button> ·
        <button class="linkish" id="openCredits" type="button" data-i18n="settings.licenses"></button> ·
        <span id="version"></span>
      </p>
      <button class="btn ghost wide" data-close type="button" data-i18n="common.close"></button>
    </div>
  </dialog>

  <!-- 응원하기 -->
  <!-- 기상 알람이 울릴 때: 잠금화면 위로 뜨는 알람 화면. [확인] 을 눌러야 꺼짐 -->
  <dialog class="wake-alarm" id="wakeAlarm" aria-labelledby="waTime">
    <div class="wa-stripes" aria-hidden="true"></div>
    <div class="wa-body">
      <strong class="wa-time" id="waTime"></strong>
      <div class="wa-shout" id="waShout"></div>
      <div class="wa-faces" id="waFaces" aria-hidden="true"></div>
      <p class="wa-line" id="waLine"></p>
      <button class="wa-ok" id="waOk" type="button" data-i18n="alarm.ok"></button>
      <button class="wa-snooze" id="waSnooze" type="button" data-i18n="alarm.snooze"></button>
    </div>
  </dialog>

  <!-- 기상 알람: 이 시각에 방구로 깨우고, 이때부터 24시까지가 방구 시간 -->
  <dialog class="sheet small" id="wakeSheet" aria-labelledby="wakeTitle">
    <div class="sheet-body rest">
      <h2 class="rest-title" id="wakeTitle" data-i18n="wake.title"></h2>
      <div class="rest-row"><div class="wheel" id="wH" aria-label="hour"></div><b>:</b><div class="wheel" id="wM" aria-label="minute"></div></div>
      <p class="rest-note" data-i18n="wake.note"></p>
      <button class="btn wide" id="wakePreview" type="button" data-i18n="wake.preview"></button>
      <div class="rest-actions">
        <button class="btn ghost" data-close type="button" data-i18n="rest.cancel"></button>
        <button class="btn primary" id="wakeSave" type="button" data-i18n="rest.save"></button>
      </div>
    </div>
  </dialog>

  <!-- 쫄? 매일 쉬는 시간 -->
  <dialog class="sheet small" id="restSheet" aria-labelledby="restTitle">
    <div class="sheet-body rest">
      <h2 class="rest-title" id="restTitle" data-i18n="rest.title"></h2>
      <div class="rest-row"><div class="wheel" id="rFromH" aria-label="hour"></div><b>:</b><div class="wheel" id="rFromM" aria-label="minute"></div><span data-i18n="rest.from"></span></div>
      <div class="rest-row"><div class="wheel" id="rToH" aria-label="hour"></div><b>:</b><div class="wheel" id="rToM" aria-label="minute"></div><span data-i18n="rest.to"></span></div>
      <p class="rest-note" data-i18n="rest.note"></p>
      <div class="rest-actions">
        <button class="btn ghost" data-close type="button" data-i18n="rest.cancel"></button>
        <button class="btn primary" id="restSave" type="button" data-i18n="rest.save"></button>
      </div>
    </div>
  </dialog>

  <dialog class="sheet small" id="supportSheet">
    <div class="sheet-body">
      <h3 data-i18n="support.title"></h3>
      <p data-i18n="support.body"></p>
      <div class="tips" id="tips"></div>
      <p class="muted small" data-i18n="support.note"></p>
      <button class="btn ghost wide" data-close type="button" data-i18n="common.close"></button>
    </div>
  </dialog>

  <!-- 첫 실행 -->
  <!-- 사용설명 (처음 한 번 · 설정에서 다시 보기): 옆으로 넘기는 5장 -->
  <dialog class="guide" id="guide" aria-label="사용설명">
    <div class="guide-pages" id="guidePages"></div>
    <div class="guide-dots" id="guideDots" aria-hidden="true"></div>
    <div class="guide-actions">
      <button class="btn ghost" id="guideSkip" type="button" data-i18n="guide.skip"></button>
      <button class="btn primary" id="guideNext" type="button" data-i18n="guide.next"></button>
    </div>
  </dialog>

  <!-- 개인정보처리방침 · 출처 (앱 안에서, src/legal.js) -->
  <dialog class="sheet" id="legalSheet" aria-labelledby="legalTitle">
    <div class="sheet-body">
      <h3 id="legalTitle"></h3>
      <div class="legal" id="legalBody"></div>
      <button class="btn primary wide" data-close type="button" data-i18n="common.close"></button>
    </div>
  </dialog>

  <!-- 패치노트: 업데이트하고 처음 열 때 한 번 -->
  <!-- 소리 규칙: 미디어 볼륨 기준 (홈 볼륨 버튼 옆 ⓘ) -->
  <dialog class="sheet" id="rulesSheet" aria-labelledby="rulesTitle">
    <div class="sheet-body">
      <h3 id="rulesTitle" data-i18n="rules.title"></h3>
      <div id="rulesBody"></div>
      <button class="btn primary wide" data-close type="button" data-i18n="rules.ok"></button>
    </div>
  </dialog>

  <dialog class="sheet" id="notesSheet" aria-labelledby="notesTitle">
    <div class="sheet-body">
      <h3 id="notesTitle" data-i18n="notes.title"></h3>
      <div class="notes" id="notesList"></div>
      <button class="btn primary wide" data-close type="button" data-i18n="notes.ok"></button>
    </div>
  </dialog>

  <!-- 새 버전 알림 (Google Play 인앱 업데이트) -->
  <dialog class="sheet small" id="updateSheet" aria-labelledby="updTitle">
    <div class="sheet-body">
      <h3 id="updTitle"></h3>
      <p id="updBody"></p>
      <button class="btn primary wide" id="updGo" type="button"></button>
      <button class="btn ghost wide" id="updLater" type="button" data-i18n="update.later"></button>
    </div>
  </dialog>

  <canvas id="card" width="1080" height="1920" hidden></canvas>
  <div class="toast" id="toast" popover="manual" role="status" aria-live="polite"></div>
</body>
</html>
